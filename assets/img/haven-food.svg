<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated collage of brunch food">
  <defs>
    <!-- warm ground so the wordmark is never empty -->
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7b98a"/>
      <stop offset="0.5" stop-color="#d98b5f"/>
      <stop offset="1" stop-color="#c1643b"/>
    </linearGradient>

    <!-- fried egg -->
    <g id="egg">
      <path d="M50 12c22-2 38 14 36 34-2 14 6 22-6 32-10 8-26 12-38 6C28 78 14 70 14 52 14 30 30 14 50 12Z" fill="#fffaf3"/>
      <circle cx="48" cy="46" r="15" fill="#f6b300"/>
      <circle cx="43" cy="41" r="4" fill="#ffd45e"/>
    </g>

    <!-- avocado half -->
    <g id="avo">
      <ellipse cx="50" cy="50" rx="31" ry="39" fill="#33521c"/>
      <ellipse cx="50" cy="50" rx="24" ry="32" fill="#a9cf66"/>
      <ellipse cx="50" cy="50" rx="17" ry="24" fill="#cfe39a"/>
      <circle cx="50" cy="56" r="12" fill="#9a6233"/>
    </g>

    <!-- coffee cup -->
    <g id="coffee">
      <path d="M22 38h52l-5 36a9 9 0 0 1-9 8H36a9 9 0 0 1-9-8Z" fill="#fffaf3"/>
      <ellipse cx="48" cy="39" rx="26" ry="6" fill="#3a2417"/>
      <path d="M74 46h6a11 11 0 0 1 0 22h-6" fill="none" stroke="#fffaf3" stroke-width="6"/>
      <path d="M40 20c-4 6 4 8 0 14M54 20c-4 6 4 8 0 14" fill="none" stroke="#efdacc" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- pancake stack -->
    <g id="pancake">
      <ellipse cx="50" cy="68" rx="34" ry="10" fill="#c67e3c"/>
      <ellipse cx="50" cy="58" rx="34" ry="10" fill="#e3a155"/>
      <ellipse cx="50" cy="48" rx="34" ry="10" fill="#efb46a"/>
      <path d="M22 48c10 6 46 6 56 0 4 10-2 16-2 16-8 5-44 5-52 0 0 0-6-6-2-16Z" fill="#f0b96f"/>
      <rect x="42" y="34" width="16" height="11" rx="3" fill="#f6d860"/>
      <path d="M30 50c0 8-4 12-4 12" stroke="#9a5a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- strawberry -->
    <g id="berry">
      <path d="M50 32c16 0 24 12 24 24 0 18-16 28-24 28s-24-10-24-28c0-12 8-24 24-24Z" fill="#c63227"/>
      <path d="M38 30l12-7 12 7-5 7H43Z" fill="#3a7d3a"/>
      <g fill="#ffe6b8"><circle cx="42" cy="48" r="2"/><circle cx="56" cy="48" r="2"/><circle cx="49" cy="58" r="2"/><circle cx="40" cy="62" r="2"/><circle cx="59" cy="62" r="2"/><circle cx="50" cy="72" r="2"/></g>
    </g>

    <!-- tomato slice -->
    <g id="tomato">
      <circle cx="50" cy="50" r="32" fill="#d8412c"/>
      <circle cx="50" cy="50" r="25" fill="#ea7257"/>
      <g fill="#f6c0a3"><ellipse cx="50" cy="35" rx="4" ry="8"/><ellipse cx="63" cy="44" rx="8" ry="4"/><ellipse cx="63" cy="56" rx="8" ry="4"/><ellipse cx="50" cy="65" rx="4" ry="8"/><ellipse cx="37" cy="56" rx="8" ry="4"/><ellipse cx="37" cy="44" rx="8" ry="4"/></g>
    </g>

    <!-- citrus -->
    <g id="citrus">
      <circle cx="50" cy="50" r="32" fill="#f2a93b"/>
      <circle cx="50" cy="50" r="25" fill="#fbd07a"/>
      <g stroke="#f2a93b" stroke-width="3"><path d="M50 27v46M27 50h46M34 34l32 32M66 34 34 66"/></g>
    </g>

    <!-- croissant -->
    <g id="croissant">
      <path d="M18 64c10-30 54-30 64 0-20-10-44-10-64 0Z" fill="#d99a4d"/>
      <path d="M30 58c8-4 32-4 40 0" stroke="#b87a32" stroke-width="3" fill="none"/>
    </g>

    <!-- leaf -->
    <g id="leaf">
      <path d="M26 74C26 40 74 26 74 26S62 74 26 74Z" fill="#5f8a39"/>
      <path d="M34 66C46 50 64 38 70 32" stroke="#cfe39a" stroke-width="3" fill="none"/>
    </g>

    <!-- blueberries -->
    <g id="blueberries" fill="#46538f">
      <circle cx="38" cy="46" r="13"/><circle cx="62" cy="42" r="12"/><circle cx="52" cy="64" r="13"/>
      <circle cx="38" cy="46" r="4" fill="#2f3a6b"/><circle cx="62" cy="42" r="4" fill="#2f3a6b"/><circle cx="52" cy="64" r="4" fill="#2f3a6b"/>
    </g>
  </defs>

  <rect width="1600" height="520" fill="url(#ground)"/>

  <!-- scattered food, sized to fill the thick letterforms -->
  <g>
    <use href="#egg"        transform="translate(20 30) scale(1.7)"/>
    <use href="#avo"        transform="translate(180 40) scale(1.5) rotate(-8)"/>
    <use href="#pancake"    transform="translate(300 20) scale(1.8)"/>
    <use href="#coffee"     transform="translate(470 30) scale(1.7)"/>
    <use href="#berry"      transform="translate(620 40) scale(1.5) rotate(10)"/>
    <use href="#tomato"     transform="translate(740 30) scale(1.6)"/>
    <use href="#citrus"     transform="translate(890 36) scale(1.5)"/>
    <use href="#leaf"       transform="translate(1030 30) scale(1.7) rotate(-6)"/>
    <use href="#croissant"  transform="translate(1170 60) scale(1.9)"/>
    <use href="#blueberries" transform="translate(1340 36) scale(1.6)"/>
    <use href="#avo"        transform="translate(1470 40) scale(1.5) rotate(12)"/>

    <use href="#tomato"     transform="translate(60 250) scale(1.7)"/>
    <use href="#croissant"  transform="translate(210 250) scale(1.8)"/>
    <use href="#coffee"     transform="translate(360 250) scale(1.7) rotate(6)"/>
    <use href="#leaf"       transform="translate(520 250) scale(1.6) rotate(20)"/>
    <use href="#egg"        transform="translate(650 250) scale(1.6)"/>
    <use href="#citrus"     transform="translate(800 250) scale(1.6)"/>
    <use href="#pancake"    transform="translate(940 250) scale(1.7)"/>
    <use href="#berry"      transform="translate(1110 250) scale(1.6) rotate(-12)"/>
    <use href="#avo"        transform="translate(1240 250) scale(1.6)"/>
    <use href="#blueberries" transform="translate(1390 250) scale(1.6)"/>

    <use href="#berry"      transform="translate(120 400) scale(1.5) rotate(8)"/>
    <use href="#citrus"     transform="translate(280 410) scale(1.4)"/>
    <use href="#egg"        transform="translate(430 400) scale(1.5)"/>
    <use href="#avo"        transform="translate(600 410) scale(1.4)"/>
    <use href="#coffee"     transform="translate(740 400) scale(1.5)"/>
    <use href="#tomato"     transform="translate(900 405) scale(1.5)"/>
    <use href="#leaf"       transform="translate(1040 400) scale(1.5) rotate(-14)"/>
    <use href="#croissant"  transform="translate(1180 420) scale(1.6)"/>
    <use href="#berry"      transform="translate(1360 405) scale(1.5)"/>
  </g>
</svg>
