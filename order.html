<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Order · HAVEN</title>
  <meta name="description" content="Order to your table at HAVEN — scan, choose, send." />
  <meta name="theme-color" content="#fffaf7" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23c1643b%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Georgia,serif%27 font-size=%2720%27 fill=%27%23fffaf7%27 text-anchor=%27middle%27%3Eh%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/style.css?v=10" />
</head>
<body class="app">

  <div class="app-offline" id="offlineBar">You're offline — your order is saved and will send automatically.</div>

  <header class="app-top">
    <a class="brand" href="index.html" aria-label="HAVEN home">haven</a>
    <span class="table-badge" id="tableBadge">Table —</span>
  </header>

  <main class="order-menu">
    <div class="order-intro">
      <h1 class="head-italic">Order to your table</h1>
      <p>Tap to add. Your basket saves automatically — send whenever you're ready.</p>
    </div>
    <div id="orderMenu"></div>
  </main>

  <div class="cart-bar" id="cartBar">
    <span class="cart-bar__sum" id="cartSum">0 items<small>€0</small></span>
    <button class="btn btn--cream" id="cartSend" type="button">Send to kitchen</button>
  </div>

  <!-- confirmation -->
  <div class="confirm" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmHeading">
    <div class="confirm__inner">
      <div class="confirm__check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 id="confirmHeading" class="head-italic">Order sent!</h2>
      <span class="title-special">Sit back &amp; relax</span>
      <p>We've got it, <span id="confirmTable">Table —</span>. Your order is on the pass.</p>
      <div class="confirm__timer" id="confirmTimer">Preparing · 0s</div>
      <button class="btn" id="confirmDone" type="button" style="margin-top:1.6rem">Order more</button>
    </div>
  </div>

  <script src="assets/js/order.js?v=10" defer></script>
</body>
</html>
