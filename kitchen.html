<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen · HAVEN</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23c1643b%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Georgia,serif%27 font-size=%2720%27 fill=%27%23fffaf7%27 text-anchor=%27middle%27%3Eh%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/style.css?v=13" />
</head>
<body class="app">

  <header class="app-top">
    <a class="brand" href="index.html" aria-label="HAVEN home">haven</a>
    <span class="table-badge">Kitchen board</span>
  </header>

  <main class="kds">
    <div class="kds-head">
      <h1 class="head-italic" style="font-size:clamp(1.6rem,4vw,2.2rem)">Live orders</h1>
      <label style="font-size:0.85rem;color:var(--c-cocoa-soft)">
        <input type="checkbox" id="chime" checked /> Sound on new order
      </label>
    </div>
    <div class="kds-grid" id="board"></div>
    <p class="kds-empty" id="empty">No live orders. New tickets appear here automatically.</p>
  </main>

  <script>
    // Demo kitchen board: reads orders placed from order.html on the
    // same device/origin (localStorage). Polls every 3s; chimes on new.
    (function () {
      var ORDERS_KEY = "haven_orders";
      var board = document.getElementById("board");
      var empty = document.getElementById("empty");
      var chime = document.getElementById("chime");
      var known = {};
      var primed = false;

      function read() {
        try { return JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]"); }
        catch (e) { return []; }
      }
      function write(v) { localStorage.setItem(ORDERS_KEY, JSON.stringify(v)); }
      function fmt(n) { return (Math.round(n * 100) / 100).toString(); }
      function ago(ts) {
        var s = Math.floor((Date.now() - ts) / 1000);
        if (s < 60) return s + "s ago";
        return Math.floor(s / 60) + "m ago";
      }

      function beep() {
        try {
          var ac = new (window.AudioContext || window.webkitAudioContext)();
          var o = ac.createOscillator(), g = ac.createGain();
          o.connect(g); g.connect(ac.destination);
          o.frequency.value = 880; o.type = "sine";
          g.gain.setValueAtTime(0.001, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
          o.start(); o.stop(ac.currentTime + 0.42);
        } catch (e) {}
      }

      function done(id) {
        write(read().filter(function (o) { return o.clientOrderId !== id; }));
        render();
      }
      window.__done = done;

      function render() {
        var orders = read().filter(function (o) { return o.status !== "done"; });
        var fresh = false;
        orders.forEach(function (o) {
          if (!known[o.clientOrderId]) { known[o.clientOrderId] = true; if (primed) fresh = true; }
        });
        if (fresh && chime.checked) beep();
        primed = true;

        empty.style.display = orders.length ? "none" : "block";
        board.innerHTML = orders
          .sort(function (a, b) { return a.placedAt - b.placedAt; })
          .map(function (o) {
            return (
              '<div class="ticket">' +
                '<div class="ticket__top"><span class="ticket__table">Table ' + o.table + "</span>" +
                '<span class="ticket__time">' + ago(o.placedAt) + "</span></div>" +
                "<ul>" + o.items.map(function (it) {
                  return "<li><span>" + it.qty + "× " + it.name + "</span><span>€" + fmt(it.qty * it.price) + "</span></li>";
                }).join("") + "</ul>" +
                '<button class="btn ticket__done" onclick="__done(\'' + o.clientOrderId + '\')">Mark ready</button>' +
              "</div>"
            );
          })
          .join("");
      }

      render();
      setInterval(render, 3000);
      window.addEventListener("storage", render);
    })();
  </script>
</body>
</html>
